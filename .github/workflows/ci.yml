name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_COLOR: 1
  VALIDATE_L10N: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: Run tests on ${{ matrix.os }}, Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 20 ]
        include:
        - os: ubuntu-latest
          node-version: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npx playwright install chromium
    - run: npm run lint
    - run: npm run build
    - run: npm run test
    - run: npx vsce package
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20'
      with:
        name: vsc-extension
        path: "*.vsix"
        retention-days: 30
  test-e2e:
    runs-on: ${{ matrix.os }}
    name: Run e2e tests
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    env:
      DEBUG: pw:browser
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 20
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10
    - run: npm i -g yarn@1
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npm run build
    - run: xvfb-run npx playwright test --grep-invert yarn-berry --reporter=blob
      working-directory: ./tests-integration
      if: matrix.os == 'ubuntu-latest'
    - run: npx playwright test --grep-invert yarn-berry --reporter=blob
      working-directory: ./tests-integration
      if: matrix.os != 'ubuntu-latest'
    - run: corepack enable
    - run: corepack prepare yarn@4 --activate
    - run: xvfb-run npx playwright test --grep yarn-berry --reporter=blob
      working-directory: ./tests-integration
      if: matrix.os == 'ubuntu-latest'
      env:
        PWTEST_BLOB_DO_NOT_REMOVE: 1
    - run: npx playwright test --grep yarn-berry --reporter=blob
      working-directory: ./tests-integration
      if: matrix.os != 'ubuntu-latest'
      env:
        PWTEST_BLOB_DO_NOT_REMOVE: 1
    - run: npx playwright merge-reports blob-report --reporter=html
      if: always()
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report-${{ matrix.os }}
        path: playwright-report/
